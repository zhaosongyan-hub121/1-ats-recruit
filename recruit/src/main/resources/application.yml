server:
  port: 8080

spring:
  application:
    name: recruit
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruit?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
  # Redis 缓存（未启动时不影响启动，CacheService 自动降级）
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  # Thymeleaf 开发模式：关闭缓存，便于实时修改模板
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.recruit: debug

# JWT 鉴权配置
jwt:
  secret: recruit-secret-key-please-change-in-production-2026
  expire-hours: 8

# Springdoc OpenAPI 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    show-common-parameters: true
