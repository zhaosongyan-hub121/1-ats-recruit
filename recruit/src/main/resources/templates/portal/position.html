<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职位详情 - ATS 招聘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #303133;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }
        input, textarea { font-family: inherit; }

        /* ===== 顶部导航 ===== */
        .top-nav {
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .top-nav-inner {
            max-width: 1280px; margin: 0 auto;
            padding: 0 24px; height: 60px;
            display: flex; align-items: center; gap: 24px;
        }
        .brand {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(90deg, #67c23a, #409eff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 6px;
        }
        .brand::before { content: "🎯"; font-size: 24px; -webkit-text-fill-color: initial; }
        .nav-links { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
        .nav-links a {
            font-size: 14px; color: #606266; padding: 6px 14px;
            border-radius: 6px; transition: all .2s;
        }
        .nav-links a:hover, .nav-links a.active { color: #409eff; background: #ecf5ff; }
        .nav-spacer { flex: 1; }
        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .admin-entry { font-size: 13px; color: #909399; padding: 6px 12px; border-radius: 6px; transition: all .2s; }
        .admin-entry:hover { color: #409eff; background: #ecf5ff; }
        .btn-login { font-size: 14px; color: #606266; padding: 6px 16px; border: 1px solid #dcdfe6; border-radius: 6px; transition: all .2s; }
        .btn-login:hover { border-color: #409eff; color: #409eff; }
        .btn-register { font-size: 14px; color: #fff; padding: 7px 18px; border-radius: 6px; background: linear-gradient(90deg, #67c23a, #85ce61); transition: all .2s; }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(103,194,58,.3); }
        .user-menu {
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; color: #303133; cursor: pointer; position: relative;
        }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #409eff, #667eea);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
        }
        .dropdown {
            position: absolute; top: 42px; right: 0;
            background: #fff; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
            min-width: 140px; padding: 6px 0; display: none;
        }
        .dropdown.show { display: block; }
        .dropdown-item {
            display: block; padding: 10px 18px; font-size: 13px; color: #606266;
            cursor: pointer; transition: background .15s;
        }
        .dropdown-item:hover { background: #f5f7fa; color: #409eff; }
        .dropdown-item.danger:hover { color: #f56c6c; }
        .dropdown-divider { height: 1px; background: #f0f0f0; margin: 4px 0; }

        /* ===== 主体布局 ===== */
        .main-layout {
            max-width: 1200px; margin: 0 auto; padding: 24px 24px 40px;
            display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: #909399; font-size: 14px; margin-bottom: 16px; transition: color .2s;
        }
        .back-link:hover { color: #409eff; }
        .card {
            background: #fff; border-radius: 12px; padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        /* ===== 职位头部 ===== */
        .company-row {
            display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
            padding-bottom: 20px; border-bottom: 1px solid #f2f6fc;
        }
        .company-logo {
            width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .company-logo.tencent { background: linear-gradient(135deg, #0052d9, #0066ff); }
        .company-logo.alibaba { background: linear-gradient(135deg, #ff6a00, #ff5000); }
        .company-logo.bytedance { background: linear-gradient(135deg, #3370ff, #0048ff); }
        .company-info h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .company-info p { font-size: 13px; color: #909399; }

        .position-title {
            font-size: 26px; font-weight: 700; color: #303133;
            margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .status-tag {
            display: inline-block; padding: 4px 12px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .tag-open { background: #f0f9eb; color: #67c23a; }
        .cat-tag {
            display: inline-block; padding: 4px 12px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .cat-SOCIAL { background: #ecf5ff; color: #409eff; }
        .cat-CAMPUS { background: #fdf6ec; color: #e6a23c; }
        .cat-INTERN { background: #f0f9eb; color: #67c23a; }

        .position-meta {
            display: flex; flex-wrap: wrap; align-items: center; gap: 20px;
            margin-top: 14px; font-size: 15px;
        }
        .meta-salary { font-size: 22px; font-weight: 700; color: #f56c6c; }
        .meta-item { color: #606266; display: flex; align-items: center; gap: 4px; font-size: 14px; }
        .meta-item .icon { font-size: 16px; }
        .meta-tag {
            display: inline-block; padding: 4px 12px; background: #f4f4f5;
            color: #909399; border-radius: 4px; font-size: 13px;
        }
        .btn-fav-big {
            margin-left: auto; padding: 8px 20px; border: 1px solid #dcdfe6;
            border-radius: 8px; background: #fff; font-size: 14px; color: #606266;
            display: flex; align-items: center; gap: 6px; transition: all .2s; cursor: pointer;
        }
        .btn-fav-big:hover { border-color: #f56c6c; color: #f56c6c; }
        .btn-fav-big.faved { background: #fef0f0; border-color: #f56c6c; color: #f56c6c; }

        .section-block { margin-bottom: 28px; }
        .section-block:last-child { margin-bottom: 0; }
        .section-label {
            font-size: 15px; font-weight: 600; color: #303133; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::before {
            content: ""; width: 3px; height: 14px;
            background: linear-gradient(180deg, #409eff, #667eea); border-radius: 2px;
        }
        .section-content { color: #606266; font-size: 14px; line-height: 1.8; white-space: pre-wrap; padding-left: 11px; }

        /* ===== 投递卡片 ===== */
        .form-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #303133; display: flex; align-items: center; gap: 8px; }
        .form-card .subtitle { color: #909399; font-size: 13px; margin-bottom: 20px; }
        .login-tip {
            background: #ecf5ff; border: 1px solid #d9ecff; border-radius: 8px;
            padding: 16px; text-align: center; margin-bottom: 16px;
        }
        .login-tip p { color: #409eff; font-size: 14px; margin-bottom: 12px; }
        .login-tip .tip-btns { display: flex; gap: 12px; justify-content: center; }
        .login-tip a {
            padding: 8px 20px; border-radius: 6px; font-size: 14px; font-weight: 500; transition: all .2s;
        }
        .login-tip .btn-to-login { background: #409eff; color: #fff; }
        .login-tip .btn-to-login:hover { background: #66b1ff; }
        .login-tip .btn-to-register { border: 1px solid #409eff; color: #409eff; }
        .login-tip .btn-to-register:hover { background: #ecf5ff; }
        .logged-tip {
            background: #f0f9eb; border: 1px solid #e1f3d8; border-radius: 8px;
            padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #67c23a;
            display: flex; align-items: center; gap: 6px;
        }
        .applied-tip {
            background: #fdf6ec; border: 1px solid #faecd8; border-radius: 8px;
            padding: 16px; text-align: center; margin-bottom: 16px;
        }
        .applied-tip p { color: #e6a23c; font-size: 14px; margin-bottom: 8px; }
        .applied-tip .status { font-size: 16px; font-weight: 600; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; color: #606266; margin-bottom: 6px; font-weight: 500; }
        .field label .required { color: #f56c6c; margin-left: 2px; }
        .field input, .field textarea, .field select {
            width: 100%; border: 1px solid #dcdfe6; border-radius: 8px; padding: 10px 14px;
            font-size: 14px; outline: none; transition: all .2s; font-family: inherit; color: #303133; background: #fff;
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            border-color: #409eff; box-shadow: 0 0 0 3px rgba(64,158,255,0.15);
        }
        .field input.error, .field textarea.error { border-color: #f56c6c; }
        .field textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
        .field textarea.tall { min-height: 120px; }
        .field .hint { color: #c0c4cc; font-size: 12px; margin-top: 4px; }
        .field .error-msg { color: #f56c6c; font-size: 12px; margin-top: 4px; display: none; }
        .field .error-msg.show { display: block; }
        .submit-btn {
            width: 100%; height: 48px; border: none; border-radius: 8px; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
            background: linear-gradient(90deg, #67c23a, #85ce61); transition: all .2s; margin-top: 8px;
        }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(103,194,58,0.4); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 加载/错误状态 */
        .loading { text-align: center; padding: 80px 20px; color: #909399; }
        .loading .icon { font-size: 48px; margin-bottom: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .error-state { text-align: center; padding: 80px 20px; color: #f56c6c; }
        .error-state .icon { font-size: 48px; margin-bottom: 16px; }

        .footer {
            text-align: center; padding: 24px; color: #c0c4cc; font-size: 12px;
            background: #fff; border-top: 1px solid #ebeef5; margin-top: 20px;
        }

        /* Toast */
        .toast {
            position: fixed; top: 30%; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: rgba(0,0,0,.75); color: #fff;
            border-radius: 8px; font-size: 14px; z-index: 999;
            opacity: 0; transition: opacity .3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .top-nav-inner { padding: 0 12px; gap: 12px; flex-wrap: wrap; height: auto; padding-top: 10px; padding-bottom: 10px; }
            .main-layout { padding: 16px 12px; }
            .card { padding: 20px; }
            .position-title { font-size: 22px; }
            .meta-salary { font-size: 18px; }
            .position-meta { gap: 12px; }
            .btn-fav-big { margin-left: 0; }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="top-nav">
    <div class="top-nav-inner">
        <a href="/portal" class="brand">ATS 招聘</a>
        <div class="nav-links">
            <a href="/portal">职位大厅</a>
            <a href="/portal/profile" id="profileLink" style="display:none">个人中心</a>
        </div>
        <div class="nav-spacer"></div>
        <div class="nav-actions">
            <a href="/dashboard" class="admin-entry" title="企业管理端">企业入口 →</a>
            <div id="guestArea">
                <a href="/login" class="btn-login">登录</a>
                <a href="/register" class="btn-register">注册</a>
            </div>
            <div id="userArea" class="user-menu" style="display:none" onclick="toggleDropdown(event)">
                <div class="user-avatar" id="userAvatar"></div>
                <span id="userName" style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
                <div class="dropdown" id="userDropdown">
                    <a class="dropdown-item" href="/portal/profile">👤 个人中心</a>
                    <a class="dropdown-item" href="/portal/profile?tab=favorites">⭐ 我的收藏</a>
                    <a class="dropdown-item" href="/portal/profile?tab=applications">📋 投递记录</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item danger" href="javascript:;" onclick="handleLogout()">🚪 退出登录</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="main-layout" id="mainContent">
    <div class="loading"><div class="icon">⏳</div><p>加载中...</p></div>
</div>

<footer class="footer">
    © 2026 ATS 招聘 · Powered by Spring Boot + Thymeleaf · 仅供学习演示使用
</footer>

<div id="toast" class="toast"></div>

<script src="/ats-common.js"></script>
<script>
const TOKEN_KEY = 'ATS_TOKEN';
const USER_KEY  = 'ATS_USER';

let state = {
    positionId: null,
    position: null,
    favorited: false
};

function authHeaders() {
    const token = localStorage.getItem(TOKEN_KEY);
    return {
        'Content-Type': 'application/json',
        'Authorization': token ? 'Bearer ' + token : ''
    };
}

function showToast(msg, ms) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms || 1800);
}

function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function companyLogoClass(name) {
    if (!name) return '';
    if (name.indexOf('腾讯') >= 0) return 'tencent';
    if (name.indexOf('阿里') >= 0) return 'alibaba';
    if (name.indexOf('字节') >= 0) return 'bytedance';
    return '';
}

function companyLogoText(name, fallback) {
    if (name) {
        if (name.length <= 2) return name;
        return name.charAt(0);
    }
    return fallback || '?';
}

function validateEmail(val) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val); }

// ============ 鉴权 UI ============
function initAuthUI() {
    const token = localStorage.getItem(TOKEN_KEY);
    const userStr = localStorage.getItem(USER_KEY);
    const guestArea = document.getElementById('guestArea');
    const userArea = document.getElementById('userArea');
    const profileLink = document.getElementById('profileLink');
    if (token && userStr) {
        try {
            const user = JSON.parse(userStr);
            guestArea.style.display = 'none';
            userArea.style.display = 'flex';
            profileLink.style.display = '';
            document.getElementById('userName').innerText = user.realName || user.username;
            document.getElementById('userAvatar').innerText = (user.realName || user.username).charAt(0).toUpperCase();
        } catch (e) {
            guestArea.style.display = ''; userArea.style.display = 'none'; profileLink.style.display = 'none';
        }
    } else {
        guestArea.style.display = ''; userArea.style.display = 'none'; profileLink.style.display = 'none';
    }
}

function toggleDropdown(e) {
    e.stopPropagation();
    document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', () => document.getElementById('userDropdown').classList.remove('show'));

async function handleLogout() {
    try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch(e){}
    localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY);
    showToast('已退出登录');
    setTimeout(() => location.reload(), 600);
}

// ============ 收藏功能 ============
async function toggleFav() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
        showToast('请先登录');
        setTimeout(() => { window.location.href = '/login?redirect=' + encodeURIComponent(location.pathname); }, 800);
        return;
    }
    try {
        const resp = await fetch('/api/portal/favorites/' + state.positionId, {
            method: 'POST', headers: authHeaders(), credentials: 'include'
        });
        const json = await resp.json();
        if (json.code === 0) {
            state.favorited = json.data.favorited;
            updateFavButton();
            showToast(state.favorited ? '已收藏' : '已取消收藏');
        } else {
            showToast(json.message || '操作失败');
        }
    } catch(err) { showToast('操作失败'); }
}

function updateFavButton() {
    const btn = document.getElementById('favBtn');
    if (!btn) return;
    if (state.favorited) {
        btn.classList.add('faved');
        btn.innerHTML = '❤️ 已收藏';
    } else {
        btn.classList.remove('faved');
        btn.innerHTML = '🤍 收藏职位';
    }
}

// ============ 加载职位数据 ============
async function loadPosition() {
    const pathParts = location.pathname.split('/');
    state.positionId = pathParts[pathParts.length - 1];
    if (!state.positionId || isNaN(state.positionId)) {
        renderError('职位不存在');
        return;
    }
    try {
        const resp = await fetch('/api/portal/positions/' + state.positionId);
        const json = await resp.json();
        if (json.code !== 0) {
            renderError(json.message || '职位不存在');
            return;
        }
        state.position = json.data;
        state.favorited = json.data.favorited || false;
        renderPage();
    } catch(err) {
        renderError('网络错误，请稍后重试');
    }
}

function renderError(msg) {
    document.getElementById('mainContent').innerHTML =
        '<div class="error-state"><div class="icon">⚠️</div><p>' + escapeHtml(msg) + '</p><a href="/portal" style="display:inline-block;margin-top:16px;padding:10px 24px;background:#409eff;color:#fff;border-radius:8px;">返回首页</a></div>';
}

function renderPage() {
    const p = state.position;
    const token = localStorage.getItem(TOKEN_KEY);
    const logoText = companyLogoText(p.companyLogo || p.companyName, (p.title||'?').charAt(0));
    const logoCls = companyLogoClass(p.companyName);
    const catLabel = { SOCIAL:'社招', CAMPUS:'校招', INTERN:'实习' }[p.category] || '';
    const catCls = 'cat-' + p.category;

    const html =
    '<div>' +
        '<a href="/portal" class="back-link">← 返回职位大厅</a>' +
        '<div class="card">' +
            (p.companyName ?
            '<div class="company-row">' +
                '<div class="company-logo ' + logoCls + '">' + escapeHtml(logoText) + '</div>' +
                '<div class="company-info">' +
                    '<h2>' + escapeHtml(p.companyName) + '</h2>' +
                    '<p>' + (p.department ? escapeHtml(p.department) : '') + '</p>' +
                '</div>' +
            '</div>' : '') +
            '<div class="position-title">' +
                '<span>' + escapeHtml(p.title) + '</span>' +
                '<span class="status-tag tag-open">🔥 招聘中</span>' +
                (catLabel ? '<span class="cat-tag ' + catCls + '">' + catLabel + '</span>' : '') +
            '</div>' +
            '<div class="position-meta">' +
                '<span class="meta-salary">' + escapeHtml(p.salary || '薪资面议') + '</span>' +
                '<span class="meta-item"><span class="icon">📍</span>' + escapeHtml(p.location || '地点面议') + '</span>' +
                (p.education ? '<span class="meta-tag">🎓 ' + escapeHtml(p.education) + '</span>' : '') +
                (p.experience ? '<span class="meta-tag">💼 ' + escapeHtml(p.experience) + '</span>' : '') +
                '<button id="favBtn" class="btn-fav-big' + (state.favorited ? ' faved' : '') + '" onclick="toggleFav()">' + (state.favorited ? '❤️ 已收藏' : '🤍 收藏职位') + '</button>' +
            '</div>' +
            '<div style="margin-top:28px;"></div>' +
            '<div class="section-block">' +
                '<div class="section-label">职位描述</div>' +
                '<div class="section-content">' + escapeHtml(p.description || '暂无描述') + '</div>' +
            '</div>' +
            '<div class="section-block">' +
                '<div class="section-label">任职要求</div>' +
                '<div class="section-content">' + escapeHtml(p.requirements || '暂无要求') + '</div>' +
            '</div>' +
        '</div>' +
    '</div>' +
    '<div>' +
        '<div style="height: 44px;"></div>' +
        '<div class="card form-card">' +
            '<h2>📨 投递这个职位</h2>' +
            '<p class="subtitle">填写以下信息，我们的 HR 会尽快审核</p>' +
            (token ? '' :
            '<div id="loginTip" class="login-tip">' +
                '<p>🔒 请先登录后再投递简历</p>' +
                '<div class="tip-btns">' +
                    '<a href="/login?redirect=' + encodeURIComponent('/portal/position/' + state.positionId + '?apply=1') + '" class="btn-to-login">立即登录</a>' +
                    '<a href="/register?redirect=' + encodeURIComponent('/portal/position/' + state.positionId + '?apply=1') + '" class="btn-to-register">注册账号</a>' +
                '</div>' +
            '</div>') +
            '<div id="loggedArea" style="display:' + (token ? '' : 'none') + '">' +
                '<div class="logged-tip">' +
                    '<span>✅</span><span>已登录，信息将自动保存到您的简历</span>' +
                '</div>' +
                '<form id="applyForm" autocomplete="off">' +
                    '<div class="field">' +
                        '<label for="name">姓名<span class="required">*</span></label>' +
                        '<input id="name" type="text" placeholder="请输入您的姓名" required>' +
                        '<div class="error-msg" id="nameErr">请输入姓名</div>' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="email">邮箱<span class="required">*</span></label>' +
                        '<input id="email" type="email" placeholder="e******@***********" required>' +
                        '<div class="error-msg" id="emailErr">请输入有效的邮箱地址</div>' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="phone">电话</label>' +
                        '<input id="phone" type="tel" placeholder="138 xxxx xxxx">' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="skills">技能</label>' +
                        '<input id="skills" type="text" placeholder="Java, SpringBoot, MySQL">' +
                        '<div class="hint">多个技能用英文逗号分隔</div>' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="experienceYears">工作年限</label>' +
                        '<input id="experienceYears" type="number" min="0" max="50" placeholder="例如：3">' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="resumeText">简历文本</label>' +
                        '<textarea id="resumeText" class="tall" placeholder="请粘贴您的简历内容，或简要介绍个人经历、项目经验等..."></textarea>' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="coverLetter">附言 / Cover Letter</label>' +
                        '<textarea id="coverLetter" placeholder="想对 HR 说的话，可留空..."></textarea>' +
                    '</div>' +
                    '<button type="submit" class="submit-btn" id="submitBtn">✅ 提交投递申请</button>' +
                '</form>' +
            '</div>' +
        '</div>' +
    '</div>';

    document.getElementById('mainContent').innerHTML = html;

    // 如果已登录，加载用户简历信息预填
    if (token) {
        loadProfileForForm();
        bindFormSubmit();
    }

    // 检查 URL 是否有 apply=1 参数，滚动到投递表单
    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get('apply') === '1') {
        setTimeout(() => {
            const formCard = document.querySelector('.form-card');
            if (formCard) formCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
    }
}

async function loadProfileForForm() {
    try {
        const resp = await fetch('/api/portal/me/profile', { headers: authHeaders(), credentials: 'include' });
        const json = await resp.json();
        if (json.code === 0 && json.data) {
            const d = json.data;
            if (d.realName) document.getElementById('name').value = d.realName;
            if (d.email) document.getElementById('email').value = d.email;
            if (d.phone) document.getElementById('phone').value = d.phone;
            if (d.skills) document.getElementById('skills').value = d.skills;
            if (d.experienceYears != null) document.getElementById('experienceYears').value = d.experienceYears;
            if (d.resumeText) document.getElementById('resumeText').value = d.resumeText;
        }
    } catch(e) {}
}

function bindFormSubmit() {
    const form = document.getElementById('applyForm');
    if (!form) return;
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const nameEl = document.getElementById('name');
        const emailEl = document.getElementById('email');
        const nameErr = document.getElementById('nameErr');
        const emailErr = document.getElementById('emailErr');

        nameEl.classList.remove('error'); nameErr.classList.remove('show');
        emailEl.classList.remove('error'); emailErr.classList.remove('show');

        const name = nameEl.value.trim();
        const email = emailEl.value.trim();
        const phone = document.getElementById('phone').value.trim();
        const skills = document.getElementById('skills').value.trim();
        const experienceYearsRaw = document.getElementById('experienceYears').value.trim();
        const resumeText = document.getElementById('resumeText').value.trim();
        const coverLetter = document.getElementById('coverLetter').value.trim();

        let hasErr = false;
        if (!name) { nameEl.classList.add('error'); nameErr.classList.add('show'); hasErr = true; }
        if (!email || !validateEmail(email)) { emailEl.classList.add('error'); emailErr.classList.add('show'); hasErr = true; }
        if (hasErr) { showToast('请检查表单中的必填项'); return; }

        const payload = {
            positionId: Number(state.positionId),
            name: name,
            email: email,
            phone: phone || null,
            skills: skills || null,
            experienceYears: experienceYearsRaw ? Number(experienceYearsRaw) : null,
            resumeText: resumeText || null,
            coverLetter: coverLetter || null
        };

        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';

        try {
            const resp = await fetch('/api/portal/applications', {
                method: 'POST', headers: authHeaders(), credentials: 'include',
                body: JSON.stringify(payload)
            });
            const json = await resp.json();
            if (json.code === 0) {
                showToast('✅ 投递成功，等待 HR 审核');
                form.reset();
                setTimeout(function () { window.location.href = '/portal/profile?tab=applications'; }, 1500);
            } else {
                showToast(json.message || '投递失败，请稍后重试');
            }
        } catch (err) {
            showToast('网络异常，请稍后重试');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '✅ 提交投递申请';
        }
    });
}

// ============ 启动 ============
initAuthUI();
loadPosition();
</script>
</body>
</html>
