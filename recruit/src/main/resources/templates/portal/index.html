<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS 招聘 - 找工作，从此简单</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #303133;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }

        /* ===== 顶部导航 ===== */
        .top-nav {
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .top-nav-inner {
            max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 60px;
            display: flex; align-items: center; gap: 24px;
        }
        .brand {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(90deg, #67c23a, #409eff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .brand::before { content: "🎯"; font-size: 24px; -webkit-text-fill-color: initial; }
        .search-box {
            flex: 1; max-width: 520px; display: flex; height: 38px;
            border: 1px solid #dcdfe6; border-radius: 20px; overflow: hidden;
            transition: border-color .2s;
        }
        .search-box:focus-within { border-color: #67c23a; }
        .search-box input {
            flex: 1; border: none; outline: none; padding: 0 18px; font-size: 14px; background: transparent;
        }
        .search-box button {
            width: 64px; border: none;
            background: linear-gradient(90deg, #67c23a, #85ce61);
            color: #fff; font-size: 14px; cursor: pointer; transition: opacity .2s;
        }
        .search-box button:hover { opacity: .9; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-links a {
            font-size: 14px; color: #606266; padding: 6px 14px;
            border-radius: 6px; transition: all .2s; white-space: nowrap;
        }
        .nav-links a:hover { color: #409eff; background: #ecf5ff; }
        .nav-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
        .admin-entry { font-size: 13px; color: #909399; padding: 6px 12px; border-radius: 6px; transition: all .2s; white-space: nowrap; }
        .admin-entry:hover { color: #409eff; background: #ecf5ff; }
        .btn-login { font-size: 14px; color: #606266; padding: 6px 16px; border: 1px solid #dcdfe6; border-radius: 6px; transition: all .2s; }
        .btn-login:hover { border-color: #409eff; color: #409eff; }
        .btn-register { font-size: 14px; color: #fff; padding: 7px 18px; border-radius: 6px; background: linear-gradient(90deg, #67c23a, #85ce61); transition: all .2s; white-space: nowrap; }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(103,194,58,.3); }
        .user-menu {
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; color: #303133; cursor: pointer; position: relative;
        }
        .user-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, #409eff, #667eea);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 600;
        }
        .dropdown {
            position: absolute; top: 46px; right: 0; background: #fff; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1); min-width: 160px; padding: 6px 0; display: none; z-index: 200;
        }
        .dropdown.show { display: block; }
        .dropdown-item {
            display: flex; align-items: center; gap: 8px; padding: 10px 18px;
            font-size: 13px; color: #606266; cursor: pointer; transition: background .15s;
        }
        .dropdown-item:hover { background: #f5f7fa; color: #409eff; }
        .dropdown-item.danger:hover { color: #f56c6c; }
        .dropdown-divider { height: 1px; background: #f0f0f0; margin: 4px 0; }

        /* ===== Hero 区 ===== */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 48px 24px 40px;
            position: relative; overflow: hidden;
        }
        .hero::before {
            content: ""; position: absolute; top: -50%; right: -20%;
            width: 600px; height: 600px; border-radius: 50%;
            background: rgba(255,255,255,0.06);
        }
        .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; }
        .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .hero p { font-size: 15px; opacity: 0.85; margin-bottom: 28px; }
        .stats-row { display: flex; gap: 40px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 28px; font-weight: 700; }
        .stat-num .suffix { font-size: 14px; font-weight: 400; opacity: .8; margin-left: 2px; }
        .stat-label { font-size: 13px; opacity: .8; margin-top: 4px; }

        /* ===== 分类 Tab ===== */
        .category-bar {
            background: #fff; border-bottom: 1px solid #ebeef5;
            position: sticky; top: 60px; z-index: 50;
        }
        .category-bar-inner {
            max-width: 1200px; margin: 0 auto; display: flex;
            padding: 0 24px; gap: 8px;
        }
        .cat-tab {
            padding: 14px 24px; font-size: 15px; color: #606266; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all .2s;
            font-weight: 500; position: relative;
        }
        .cat-tab:hover { color: #409eff; }
        .cat-tab.active { color: #409eff; border-bottom-color: #409eff; }

        /* ===== 主内容 ===== */
        .main {
            max-width: 1200px; margin: 0 auto; padding: 24px 24px 40px;
        }

        /* 热门城市 */
        .hot-cities { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .hot-label { font-size: 13px; color: #909399; margin-right: 4px; }
        .hot-city {
            font-size: 13px; color: #606266; padding: 4px 12px; border-radius: 14px;
            cursor: pointer; transition: all .2s; border: 1px solid transparent;
        }
        .hot-city:hover { color: #409eff; background: #ecf5ff; }
        .hot-city.active { color: #fff; background: #409eff; border-color: #409eff; }

        /* 筛选行 */
        .filter-row {
            background: #fff; border-radius: 10px; padding: 16px 20px;
            margin-bottom: 16px; display: flex; align-items: center; gap: 16px;
            flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .filter-item { display: flex; align-items: center; gap: 8px; }
        .filter-item label { font-size: 13px; color: #909399; white-space: nowrap; }
        .filter-item select, .filter-item input {
            height: 34px; border: 1px solid #dcdfe6; border-radius: 6px;
            padding: 0 10px; font-size: 13px; outline: none; background: #fff;
            transition: border-color .2s; font-family: inherit; color: #303133;
        }
        .filter-item select:focus, .filter-item input:focus { border-color: #409eff; }
        .filter-item select { min-width: 100px; cursor: pointer; }
        .filter-item input { width: 220px; }
        .btn-reset {
            margin-left: auto; height: 34px; padding: 0 20px;
            border: 1px solid #dcdfe6; border-radius: 6px; background: #fff;
            font-size: 13px; color: #606266; cursor: pointer; transition: all .2s;
        }
        .btn-reset:hover { border-color: #409eff; color: #409eff; }

        .result-info { font-size: 13px; color: #909399; margin-bottom: 12px; }
        .result-info strong { color: #409eff; font-size: 16px; margin: 0 2px; }

        /* 职位列表 */
        .job-list { display: flex; flex-direction: column; gap: 12px; }
        .job-item {
            background: #fff; border-radius: 10px; padding: 20px;
            display: flex; align-items: center; gap: 16px; cursor: pointer;
            transition: all .2s; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid transparent;
        }
        .job-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-color: #e4e7ed; transform: translateY(-1px); }
        .job-logo {
            width: 56px; height: 56px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .job-logo.tencent { background: linear-gradient(135deg, #0052d9, #0066ff); }
        .job-logo.alibaba { background: linear-gradient(135deg, #ff6a00, #ff5000); }
        .job-logo.bytedance { background: linear-gradient(135deg, #3370ff, #0048ff); }
        .job-body { flex: 1; min-width: 0; }
        .job-title-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 6px; flex-wrap: wrap;
        }
        .job-company { font-size: 14px; color: #909399; font-weight: 500; }
        .job-title { font-size: 16px; font-weight: 600; color: #303133; }
        .job-item:hover .job-title { color: #409eff; }
        .job-tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .tag-social { background: #ecf5ff; color: #409eff; }
        .tag-campus { background: #fdf6ec; color: #e6a23c; }
        .tag-intern { background: #f0f9eb; color: #67c23a; }
        .tag-education { background: #f4f4f5; color: #909399; }
        .tag-experience { background: #faf0f9; color: #c039d3; }
        .job-salary { font-size: 17px; font-weight: 700; color: #f56c6c; margin-left: auto; }
        .job-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #909399; flex-wrap: wrap; }
        .dot { color: #dcdfe6; }
        .job-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
        .btn-apply {
            padding: 8px 20px; border: none; border-radius: 6px; color: #fff;
            font-size: 14px; font-weight: 500; cursor: pointer;
            background: linear-gradient(90deg, #67c23a, #85ce61); transition: all .2s;
        }
        .btn-apply:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(103,194,58,.4); }
        .btn-fav {
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: #c0c4cc; transition: all .2s; padding: 4px;
        }
        .btn-fav:hover { color: #f56c6c; transform: scale(1.15); }
        .btn-fav.faved { color: #f56c6c; }
        .job-post-date { font-size: 12px; color: #c0c4cc; }

        /* 空状态 */
        .empty { text-align: center; padding: 60px 20px; color: #909399; }
        .empty .icon { font-size: 56px; margin-bottom: 12px; opacity: .5; }

        /* 分页 */
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 28px; }
        .page-btn {
            min-width: 36px; height: 36px; padding: 0 12px; border: 1px solid #dcdfe6;
            border-radius: 6px; background: #fff; font-size: 14px; color: #606266;
            cursor: pointer; transition: all .2s;
        }
        .page-btn:hover:not(:disabled) { border-color: #409eff; color: #409eff; }
        .page-btn.active { background: #409eff; color: #fff; border-color: #409eff; }
        .page-btn:disabled { opacity: .5; cursor: not-allowed; }

        .footer {
            text-align: center; padding: 24px; color: #c0c4cc; font-size: 12px;
            background: #fff; border-top: 1px solid #ebeef5; margin-top: 20px;
        }

        .toast {
            position: fixed; top: 30%; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: rgba(0,0,0,.75); color: #fff;
            border-radius: 8px; font-size: 14px; z-index: 999;
            opacity: 0; transition: opacity .3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 900px) {
            .stats-row { gap: 24px; }
            .job-salary { margin-left: 0; }
            .job-item { flex-wrap: wrap; }
        }
        @media (max-width: 768px) {
            .top-nav-inner { padding: 0 12px; gap: 12px; flex-wrap: wrap; height: auto; padding-top: 10px; padding-bottom: 10px; }
            .search-box { order: 10; max-width: 100%; width: 100%; }
            .hero { padding: 32px 16px; }
            .hero h1 { font-size: 24px; }
            .main { padding: 16px 12px; }
            .stat-num { font-size: 22px; }
            .filter-item input { width: 150px; }
            .job-right { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="top-nav-inner">
        <a href="/portal" class="brand">ATS 招聘</a>
        <div class="search-box">
            <input id="keywordInput" type="text" placeholder="搜索职位、公司、技能...">
            <button onclick="doSearch()">搜索</button>
        </div>
        <div class="nav-actions">
            <a href="/portal" style="font-size:14px;color:#409eff;font-weight:500;">首页</a>
            <a href="/portal/profile" id="profileLink" class="admin-entry" style="display:none">个人中心</a>
            <a href="/dashboard" class="admin-entry" title="企业管理端">企业入口 →</a>
            <div id="guestArea">
                <a href="/login" class="btn-login">登录</a>
                <a href="/register" class="btn-register">注册</a>
            </div>
            <div id="userArea" class="user-menu" style="display:none" onclick="toggleDropdown(event)">
                <div class="user-avatar" id="userAvatar"></div>
                <span id="userName" style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
                <div class="dropdown" id="userDropdown">
                    <a class="dropdown-item" href="/portal/profile">👤 个人中心</a>
                    <a class="dropdown-item" href="/portal/profile?tab=favorites">⭐ 我的收藏</a>
                    <a class="dropdown-item" href="/portal/profile?tab=applications">📋 投递记录</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item danger" href="javascript:;" onclick="handleLogout()">🚪 退出登录</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<section class="hero">
    <div class="hero-inner">
        <h1>找到心仪的工作，开启职业新篇章</h1>
        <p>海量优质岗位 · 智能筛选匹配 · 快速投递反馈</p>
        <div class="stats-row">
            <div class="stat-item"><div class="stat-num" id="statTotal">0<span class="suffix">+</span></div><div class="stat-label">在招岗位</div></div>
            <div class="stat-item"><div class="stat-num" id="statCompanies">0</div><div class="stat-label">合作企业</div></div>
            <div class="stat-item"><div class="stat-num" id="statSocial">0</div><div class="stat-label">社招岗位</div></div>
            <div class="stat-item"><div class="stat-num" id="statCampus">0</div><div class="stat-label">校招岗位</div></div>
            <div class="stat-item"><div class="stat-num" id="statIntern">0</div><div class="stat-label">实习岗位</div></div>
        </div>
    </div>
</section>

<div class="category-bar">
    <div class="category-bar-inner">
        <div class="cat-tab active" data-cat="" onclick="switchCategory(this, '')">全部</div>
        <div class="cat-tab" data-cat="SOCIAL" onclick="switchCategory(this, 'SOCIAL')">社招职位</div>
        <div class="cat-tab" data-cat="CAMPUS" onclick="switchCategory(this, 'CAMPUS')">校招职位</div>
        <div class="cat-tab" data-cat="INTERN" onclick="switchCategory(this, 'INTERN')">实习职位</div>
    </div>
</div>

<main class="main">
    <!-- 热门城市 -->
    <div class="hot-cities">
        <span class="hot-label">🔥 热门城市：</span>
        <span class="hot-city active" data-city="" onclick="selectHotCity(this,'')">不限</span>
    </div>

    <!-- 筛选 -->
    <div class="filter-row">
        <div class="filter-item">
            <label>省份</label>
            <select id="provinceSelect" onchange="onProvinceChange()">
                <option value="">全部省份</option>
            </select>
        </div>
        <div class="filter-item">
            <label>城市</label>
            <select id="citySelect" onchange="loadData(1)">
                <option value="">全部城市</option>
            </select>
        </div>
        <div class="filter-item">
            <label>关键词</label>
            <input id="filterKeyword" type="text" placeholder="职位/技能/公司" onkeydown="if(event.key==='Enter'){doSearch()}">
        </div>
        <button class="btn-reset" onclick="resetFilter()">重置</button>
    </div>

    <div class="result-info">共找到 <strong id="totalCount">0</strong> 个职位</div>

    <div id="jobList" class="job-list"></div>
    <div id="pagination" class="pagination"></div>
</main>

<footer class="footer">© 2026 ATS 招聘 · Powered by Spring Boot + Thymeleaf · 演示项目</footer>
<div id="toast" class="toast"></div>

<script src="/cities.js"></script>
<script src="/ats-common.js"></script>
<script>
const TOKEN_KEY = 'ATS_TOKEN';
const USER_KEY  = 'ATS_USER';
const PAGE_SIZE = 10;

let state = {
    current: 1, category: '', province: '', city: '', keyword: '', total: 0, pages: 0
};

// ============ 鉴权 UI ============
function initAuthUI() {
    const token = localStorage.getItem(TOKEN_KEY);
    const userStr = localStorage.getItem(USER_KEY);
    const guestArea = document.getElementById('guestArea');
    const userArea = document.getElementById('userArea');
    const profileLink = document.getElementById('profileLink');
    if (token && userStr) {
        try {
            const user = JSON.parse(userStr);
            guestArea.style.display = 'none';
            userArea.style.display = 'flex';
            profileLink.style.display = '';
            document.getElementById('userName').innerText = user.realName || user.username;
            document.getElementById('userAvatar').innerText = (user.realName || user.username).charAt(0).toUpperCase();
        } catch (e) {
            guestArea.style.display = ''; userArea.style.display = 'none'; profileLink.style.display = 'none';
        }
    } else {
        guestArea.style.display = ''; userArea.style.display = 'none'; profileLink.style.display = 'none';
    }
    if (token) {
        fetch('/api/auth/me', { credentials: 'include' }).then(r => r.json()).then(json => {
            if (json.code !== 0 || !json.data) {
                localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); initAuthUI();
            } else {
                localStorage.setItem(USER_KEY, JSON.stringify(json.data));
                document.getElementById('userName').innerText = json.data.realName || json.data.username;
                document.getElementById('userAvatar').innerText = (json.data.realName || json.data.username).charAt(0).toUpperCase();
            }
        }).catch(()=>{});
    }
}
function toggleDropdown(e) {
    e.stopPropagation();
    document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', () => document.getElementById('userDropdown').classList.remove('show'));
async function handleLogout() {
    try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch(e){}
    localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY);
    showToast('已退出登录'); setTimeout(() => location.reload(), 500);
}

// ============ 工具 ============
function authHeaders() {
    const token = localStorage.getItem(TOKEN_KEY);
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return headers;
}
function showToast(msg, ms) {
    const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms || 1800);
}
function categoryLabel(cat) { return { SOCIAL:'社招', CAMPUS:'校招', INTERN:'实习' }[cat] || ''; }
function categoryClass(cat) { return { SOCIAL:'tag-social', CAMPUS:'tag-campus', INTERN:'tag-intern' }[cat] || ''; }
function companyLogoClass(name) {
    if (!name) return '';
    if (name.indexOf('腾讯') >= 0) return 'tencent';
    if (name.indexOf('阿里') >= 0) return 'alibaba';
    if (name.indexOf('字节') >= 0) return 'bytedance';
    return '';
}
function companyLogoText(name, fallback) {
    if (name) {
        if (name.length <= 2) return name;
        return name.charAt(0);
    }
    return fallback || '?';
}
function formatDate(dt) {
    if (!dt) return '';
    const d = new Date(dt);
    if (isNaN(d)) return '';
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 3600) return '刚刚';
    if (diff < 86400) return Math.floor(diff/3600) + '小时前';
    if (diff < 86400*7) return Math.floor(diff/86400) + '天前';
    return (d.getMonth()+1) + '-' + d.getDate();
}
function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ 省市级联 ============
function initRegionSelects() {
    // 容错：如果cities.js未加载成功，使用内置备用数据
    var regions = window.CHINA_REGIONS;
    var hotCities = window.HOT_CITIES;
    if (!regions || !regions.length) {
        console.warn('cities.js 未加载，使用备用省市数据');
        regions = [
            { name: "北京", cities: ["北京"] },
            { name: "上海", cities: ["上海"] },
            { name: "广东", cities: ["广州", "深圳", "珠海", "东莞", "佛山"] },
            { name: "浙江", cities: ["杭州", "宁波", "温州"] },
            { name: "江苏", cities: ["南京", "苏州", "无锡"] },
            { name: "四川", cities: ["成都", "绵阳"] },
            { name: "湖北", cities: ["武汉", "宜昌"] },
            { name: "湖南", cities: ["长沙", "株洲"] },
            { name: "山东", cities: ["济南", "青岛"] },
            { name: "福建", cities: ["福州", "厦门"] },
            { name: "陕西", cities: ["西安"] },
            { name: "重庆", cities: ["重庆"] },
            { name: "天津", cities: ["天津"] }
        ];
        window.CHINA_REGIONS = regions;
    }
    if (!hotCities || !hotCities.length) {
        hotCities = ["北京", "上海", "深圳", "广州", "杭州", "成都", "南京", "武汉", "西安", "苏州"];
        window.HOT_CITIES = hotCities;
    }

    const provSel = document.getElementById('provinceSelect');
    // 清空现有选项（保留"全部省份"）
    provSel.innerHTML = '<option value="">全部省份</option>';
    regions.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.name; opt.innerText = r.name;
        provSel.appendChild(opt);
    });
    // 热门城市
    const hotBox = document.querySelector('.hot-cities');
    // 先清除之前动态添加的热门城市（保留"不限"）
    const existingHots = hotBox.querySelectorAll('.hot-city:not([data-city=""])');
    existingHots.forEach(el => el.remove());
    hotCities.forEach(c => {
        const span = document.createElement('span');
        span.className = 'hot-city'; span.dataset.city = c; span.innerText = c;
        span.onclick = () => selectHotCity(span, c);
        hotBox.appendChild(span);
    });
}
function onProvinceChange() {
    const prov = document.getElementById('provinceSelect').value;
    const citySel = document.getElementById('citySelect');
    citySel.innerHTML = '<option value="">全部城市</option>';
    state.province = prov; state.city = '';
    if (!prov) { loadData(1); return; }
    const regions = window.CHINA_REGIONS || [];
    const region = regions.find(r => r.name === prov);
    if (region) {
        region.cities.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.innerText = c;
            citySel.appendChild(opt);
        });
    }
    loadData(1);
}
function selectHotCity(el, city) {
    document.querySelectorAll('.hot-city').forEach(s => s.classList.remove('active'));
    if (el) el.classList.add('active');
    if (!city) {
        // 不限
        document.getElementById('provinceSelect').value = '';
        document.getElementById('citySelect').innerHTML = '<option value="">全部城市</option>';
        state.province = ''; state.city = '';
    } else {
        // 根据城市自动选中省份
        const regions = window.CHINA_REGIONS || [];
        for (const r of regions) {
            if (r.cities.includes(city)) {
                document.getElementById('provinceSelect').value = r.name;
                const citySel = document.getElementById('citySelect');
                citySel.innerHTML = '<option value="">全部城市</option>';
                r.cities.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    citySel.appendChild(opt);
                });
                citySel.value = city;
                state.province = r.name; state.city = city;
                break;
            }
        }
    }
    loadData(1);
}

// ============ 数据加载 ============
async function loadStats() {
    try {
        const json = await fetch('/api/portal/stats').then(r => r.json());
        if (json.code === 0 && json.data) {
            document.getElementById('statTotal').innerHTML = json.data.total + '<span class="suffix">+</span>';
            document.getElementById('statCompanies').innerText = json.data.companies || 0;
            document.getElementById('statSocial').innerText = json.data.social || 0;
            document.getElementById('statCampus').innerText = json.data.campus || 0;
            document.getElementById('statIntern').innerText = json.data.intern || 0;
        }
    } catch(e){}
}

async function loadData(page) {
    state.current = page || 1;
    state.city = document.getElementById('citySelect').value;
    state.keyword = document.getElementById('filterKeyword').value.trim();
    document.getElementById('keywordInput').value = state.keyword;

    const params = new URLSearchParams({ current: state.current, size: PAGE_SIZE });
    if (state.category) params.set('category', state.category);
    if (state.city) params.set('location', state.city);
    if (state.keyword) params.set('keyword', state.keyword);

    const listEl = document.getElementById('jobList');
    listEl.innerHTML = '<div class="empty"><div class="icon">⏳</div><p>加载中...</p></div>';

    try {
        const resp = await fetch('/api/portal/positions?' + params.toString());
        const json = await resp.json();
        if (json.code !== 0) {
            listEl.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>' + (json.message || '加载失败') + '</p></div>';
            return;
        }
        const data = json.data;
        if (!data) {
            listEl.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无数据</p></div>';
            return;
        }
        state.total = data.total || 0;
        state.pages = data.pages || 0;
        document.getElementById('totalCount').innerText = state.total;
        renderList(data.records || []);
        renderPagination();
    } catch (err) {
        listEl.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>网络错误：' + err.message + '</p></div>';
    }
}

function renderList(records) {
    const listEl = document.getElementById('jobList');
    if (!records.length) {
        listEl.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无匹配的职位，试试调整筛选条件</p></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    listEl.innerHTML = records.map(p => {
        const logoText = companyLogoText(p.companyLogo || p.companyName, (p.title||'?').charAt(0));
        const logoCls = companyLogoClass(p.companyName);
        const catLabel = categoryLabel(p.category);
        const catCls = categoryClass(p.category);
        const edu = p.education ? '<span class="job-tag tag-education">' + escapeHtml(p.education) + '</span>' : '';
        const exp = p.experience ? '<span class="job-tag tag-experience">' + escapeHtml(p.experience) + '</span>' : '';
        const loc = p.location || '地点面议';
        const dept = p.department || '';
        const company = p.companyName ? '<span class="job-company">' + escapeHtml(p.companyName) + '</span>' : '';
        const dateStr = formatDate(p.createdAt);
        const salary = p.salary || '薪资面议';
        const favCls = p.favorited ? 'faved' : '';
        const favIcon = p.favorited ? '❤️' : '🤍';

        return '<div class="job-item" onclick="goDetail(' + p.id + ', event)">' +
            '<div class="job-logo ' + logoCls + '">' + escapeHtml(logoText) + '</div>' +
            '<div class="job-body">' +
                '<div class="job-title-row">' +
                    (company ? company + ' <span class="dot" style="color:#dcdfe6;">·</span> ' : '') +
                    '<span class="job-title">' + escapeHtml(p.title) + '</span>' +
                    (catLabel ? '<span class="job-tag ' + catCls + '">' + catLabel + '</span>' : '') +
                    edu + exp +
                '</div>' +
                '<div class="job-meta">' +
                    '<span>📍 ' + escapeHtml(loc) + '</span>' +
                    (dept ? '<span class="dot">|</span><span>' + escapeHtml(dept) + '</span>' : '') +
                '</div>' +
            '</div>' +
            '<div class="job-right">' +
                '<button class="btn-fav ' + favCls + '" onclick="toggleFav(event, ' + p.id + ', this)" title="收藏">' + favIcon + '</button>' +
                '<span class="job-salary">' + escapeHtml(salary) + '</span>' +
                '<button class="btn-apply" onclick="applyJob(event, ' + p.id + ')">立即投递</button>' +
                '<span class="job-post-date">' + dateStr + '</span>' +
            '</div>' +
        '</div>';
    }).join('');
}

function renderPagination() {
    const pg = document.getElementById('pagination');
    if (state.pages <= 1) { pg.innerHTML = ''; return; }
    let html = '';
    html += '<button class="page-btn" ' + (state.current <= 1 ? 'disabled' : '') + ' onclick="loadData(' + (state.current-1) + ')">上一页</button>';
    const pages = [], total = state.pages, cur = state.current;
    pages.push(1);
    if (cur - 2 > 2) pages.push('...');
    for (let i = Math.max(2, cur-1); i <= Math.min(total-1, cur+1); i++) pages.push(i);
    if (cur + 2 < total) pages.push('...');
    if (total > 1) pages.push(total);
    pages.forEach(p => {
        if (p === '...') html += '<button class="page-btn" disabled>...</button>';
        else html += '<button class="page-btn ' + (p === cur ? 'active' : '') + '" onclick="loadData(' + p + ')">' + p + '</button>';
    });
    html += '<button class="page-btn" ' + (cur >= total ? 'disabled' : '') + ' onclick="loadData(' + (cur+1) + ')">下一页</button>';
    pg.innerHTML = html;
}

// ============ 收藏 ============
async function toggleFav(e, positionId, btnEl) {
    e.stopPropagation();
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { showToast('请先登录'); setTimeout(()=>{ window.location.href = '/login?redirect=' + encodeURIComponent(location.pathname); }, 800); return; }
    try {
        const resp = await fetch('/api/portal/favorites/' + positionId, { method: 'POST', headers: authHeaders(), credentials: 'include' });
        const json = await resp.json();
        if (json.code === 0) {
            if (json.data.favorited) {
                btnEl.classList.add('faved'); btnEl.innerText = '❤️'; showToast('已收藏');
            } else {
                btnEl.classList.remove('faved'); btnEl.innerText = '🤍'; showToast('已取消收藏');
            }
        } else {
            showToast(json.message || '操作失败');
        }
    } catch(err) { showToast('操作失败'); }
}

// ============ 交互 ============
function switchCategory(el, cat) {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    state.category = cat; loadData(1);
}
function doSearch() {
    const kw = document.getElementById('keywordInput').value.trim();
    document.getElementById('filterKeyword').value = kw;
    state.keyword = kw; loadData(1);
}
function resetFilter() {
    document.getElementById('provinceSelect').value = '';
    document.getElementById('citySelect').innerHTML = '<option value="">全部城市</option>';
    document.getElementById('filterKeyword').value = '';
    document.getElementById('keywordInput').value = '';
    document.querySelectorAll('.hot-city').forEach(s => s.classList.remove('active'));
    document.querySelector('.hot-city[data-city=""]').classList.add('active');
    state.province = ''; state.city = ''; state.keyword = '';
    loadData(1);
}
function goDetail(id, e) {
    if (e && (e.target.closest('.btn-apply') || e.target.closest('.btn-fav'))) return;
    window.location.href = '/portal/position/' + id;
}
async function applyJob(e, positionId) {
    e.stopPropagation();
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
        showToast('请先登录后再投递');
        setTimeout(() => { window.location.href = '/login?redirect=' + encodeURIComponent('/portal/position/' + positionId + '?apply=1'); }, 1000);
        return;
    }
    window.location.href = '/portal/position/' + positionId + '?apply=1';
}

// 顶部搜索框回车
document.getElementById('keywordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});

// ============ 启动 ============
initRegionSelects();
initAuthUI();
loadStats();
loadData(1);
</script>
