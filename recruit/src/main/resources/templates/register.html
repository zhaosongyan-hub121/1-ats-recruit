<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ATS 招聘系统 - 注册</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #303133;
        }
        .register-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(31, 45, 61, 0.2);
            padding: 36px 36px 28px;
            animation: cardIn .45s ease;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px);} to { opacity:1; transform:none;} }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { font-size: 26px; color: #303133; }
        .logo p { color: #909399; margin-top: 6px; font-size: 13px; }
        .logo .badge {
            display: inline-block; width: 54px; height: 54px; line-height: 54px;
            font-size: 26px; background: linear-gradient(135deg, #67c23a, #85ce61);
            color: #fff; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 8px 20px rgba(103,194,58,.35);
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 13px; color: #606266; margin-bottom: 6px; font-weight: 500;
        }
        .field input {
            width: 100%; height: 42px; border: 1px solid #dcdfe6; border-radius: 8px;
            padding: 0 14px; font-size: 14px; outline: none; transition: all .2s;
        }
        .field input:focus { border-color: #67c23a; box-shadow: 0 0 0 3px rgba(103,194,58,.15); }
        .row { display: flex; gap: 12px; }
        .row .field { flex: 1; }
        .submit-btn {
            width: 100%; height: 44px; border: none; border-radius: 8px; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
            background: linear-gradient(90deg, #67c23a, #85ce61);
            transition: all .2s;
            margin-top: 4px;
        }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(103,194,58,.35); }
        .submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .error {
            margin-bottom: 14px; padding: 10px 14px; background: #fef0f0; color: #f56c6c;
            border-radius: 8px; font-size: 13px; display: none;
        }
        .error.show { display: block; }
        .success {
            margin-bottom: 14px; padding: 10px 14px; background: #f0f9eb; color: #67c23a;
            border-radius: 8px; font-size: 13px; display: none;
        }
        .success.show { display: block; }
        .links {
            text-align: center; margin-top: 18px; font-size: 13px; color: #909399;
        }
        .links a { color: #409eff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .back-home {
            display: block; text-align: center; margin-top: 12px; font-size: 12px;
            color: #909399; text-decoration: none;
        }
        .back-home:hover { color: #409eff; }
        .footer { text-align: center; margin-top: 18px; color: #c0c4cc; font-size: 12px; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo">
            <div class="badge">✨</div>
            <h1>注册账号</h1>
            <p>注册后可投递职位、管理你的简历</p>
        </div>

        <div id="errorBox" class="error"></div>
        <div id="successBox" class="success"></div>

        <form id="registerForm" autocomplete="off">
            <div class="field">
                <label for="username">用户名 <span style="color:#f56c6c">*</span></label>
                <input id="username" type="text" placeholder="3-20位，用于登录" required minlength="3" maxlength="20">
            </div>
            <div class="row">
                <div class="field">
                    <label for="password">密码 <span style="color:#f56c6c">*</span></label>
                    <input id="password" type="password" placeholder="6-32位" required minlength="6" maxlength="32">
                </div>
                <div class="field">
                    <label for="confirmPassword">确认密码 <span style="color:#f56c6c">*</span></label>
                    <input id="confirmPassword" type="password" placeholder="再次输入密码" required minlength="6">
                </div>
            </div>
            <div class="field">
                <label for="realName">真实姓名 <span style="color:#f56c6c">*</span></label>
                <input id="realName" type="text" placeholder="请输入你的真实姓名" required>
            </div>
            <div class="row">
                <div class="field">
                    <label for="email">邮箱</label>
                    <input id="email" type="email" placeholder="选填，用于接收面试通知">
                </div>
                <div class="field">
                    <label for="phone">手机号</label>
                    <input id="phone" type="tel" placeholder="选填，11位手机号" pattern="^1[3-9]\d{9}$">
                </div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">注 册</button>
        </form>

        <div class="links">
            已有账号？<a href="/login">立即登录</a>
        </div>
        <a href="/portal" class="back-home">← 返回职位首页</a>

        <div class="footer">© 2026 ATS · Spring Boot 2.7.18 + JWT + Thymeleaf</div>
    </div>

    <script>
        const TOKEN_KEY = 'ATS_TOKEN';
        const USER_KEY  = 'ATS_USER';

        // 获取 redirect 参数
        const urlParams = new URLSearchParams(location.search);
        const redirect = urlParams.get('redirect') || '';

        // 更新"已有账号？立即登录"链接带上 redirect
        const loginLink = document.querySelector('.links a[href="/login"]');
        if (loginLink) {
            loginLink.href = redirect ? '/login?redirect=' + encodeURIComponent(redirect) : '/login';
        }

        // 已登录直接跳转
        (function () {
            if (localStorage.getItem(TOKEN_KEY)) {
                window.location.replace(redirect || '/portal');
            }
        })();

        const form = document.getElementById('registerForm');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            successBox.classList.remove('show');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const realName = document.getElementById('realName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (password !== confirmPassword) {
                errorBox.innerText = '两次密码输入不一致';
                errorBox.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '注册中...';
            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirmPassword, realName, email, phone })
                });
                const json = await resp.json();
                if (json.code === 0 && json.data && json.data.token) {
                    localStorage.setItem(TOKEN_KEY, json.data.token);
                    localStorage.setItem(USER_KEY, JSON.stringify(json.data));
                    successBox.innerText = '注册成功！正在跳转...';
                    successBox.classList.add('show');
                    setTimeout(() => { window.location.replace(redirect || '/portal'); }, 800);
                } else {
                    errorBox.innerText = json.message || '注册失败，请重试';
                    errorBox.classList.add('show');
                }
            } catch (err) {
                errorBox.innerText = '请求失败：' + (err.message || err);
                errorBox.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '注 册';
            }
        });
    </script>
</body>
</html>
