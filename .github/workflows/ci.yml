name: Build & Test

on:
  push:
    branches: [main, master]
    paths:
      - "recruit/**"
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: recruit

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: recruit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -p1234"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "8"
          cache: "maven"

      - name: Import schema to MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -p1234 recruit < src/main/resources/db/schema.sql

      - name: Build with Maven
        run: mvn -B -q clean package -DskipTests

      - name: Run Unit Tests
        run: mvn -B test
